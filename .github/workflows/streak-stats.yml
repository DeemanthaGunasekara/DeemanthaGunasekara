name: Update streak stats

on:
  schedule:
    - cron: "0 0,12 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          user: DeemanthaGunasekara
          theme: github_dark
          hide_border: true
          background: 0D1117
          path: profile/streak.svg

      - name: Commit and push generated streak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update streak stats [skip ci]" && git push)
